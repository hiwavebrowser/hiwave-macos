<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font: 16px/20px Helvetica, sans-serif; }
  .grid { display: grid; grid-template-columns: 200px 200px 200px; gap: 10px; width: 620px; margin: 10px; }
  .item { display: flex; align-items: center; gap: 8px; padding: 8px; border: 1px solid #888; background: #eef; }
  .col { flex-direction: column; justify-content: center; align-items: flex-start; }
  .tall { height: 100px; background: #fee; }
  .start { align-self: start; }
  .mark { width: 30px; height: 20px; background: #06c; }
</style>
</head>
<body>
<!-- the row's height comes from a fixed-height item, so the estimate is right and no row is repaired -->
<div class="grid" id="g1">
  <div class="tall" id="tall"></div>
  <div class="item" id="row"><div class="mark" id="row-m"></div></div>
  <div class="item col" id="col"><div class="mark" id="col-m"></div></div>
  <div class="tall" id="tall2"></div>
  <div class="item start" id="start"><div class="mark" id="start-m"></div></div>
  <div class="item" id="text"><span id="text-s">One line</span></div>
</div>
</body>
</html>
