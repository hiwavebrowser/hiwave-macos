<!doctype html>
<html><head><style>
body{margin:0}
div{box-sizing:border-box;position:relative}
.col{display:flex;flex-direction:column}
.h100{height:100vh}
.r14{flex-shrink:0;max-width:100%;min-height:100vh}
.r15{flex-grow:1;min-height:0}
.r16{flex-shrink:0;max-width:100%;flex-grow:1;width:100%}
.r17{max-width:100%;flex-basis:100%;flex-grow:1;flex-shrink:1;min-height:0}
.r18{flex-grow:1;min-height:0}
.r19{max-width:100%;flex-basis:100%;flex-grow:1;flex-shrink:1;min-height:0}
.r20{display:flex;flex-basis:0;flex-grow:1;flex-shrink:1;min-width:0}
.main{height:730px;width:100px;background:#def}
.r128{flex-shrink:0;max-width:100%}
hr{margin:0;border:0;height:1px;background:#888}
.foot{height:174px;background:#fed}
</style></head><body>
<div class="h100">
 <div id="r14" class="col r14">
  <div id="r15" class="col r15">
   <div id="r16" class="col r16">
    <div id="r17" class="col r17">
     <div id="r18" class="col r18">
      <div id="r19" class="col r19">
       <div id="r20" class="r20"><div class="main"></div></div>
      </div>
     </div>
    </div>
   </div>
   <div class="col r128"><div><hr id="hr"></div></div>
   <div class="col r128"><div class="foot"></div></div>
  </div>
 </div>
</div>
</body></html>
