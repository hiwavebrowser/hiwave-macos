<!doctype html>
<html><head><meta charset="utf-8">
<style>
body { margin: 10px; background: #fff; font: 12px/16px Helvetica, sans-serif; }
div.c, div.g { float: left; width: 120px; height: 40px; margin: 0 8px 8px 0; }
.c { background-color: red; }
.g { background: linear-gradient(blue, blue); }
#d1 { background: none; }
#d2 { background: 0 0; }
#d3 { background: unset; }
#d4 { background: initial; }
#d5 { background: url(nope.png) no-repeat; }
#d6 { background: linear-gradient(transparent, transparent); }
#d7 { background: green; }
#d8 { background: green url(nope.png) no-repeat; }
#d9 { background: url(nope.png) no-repeat green; }
#d10 { background-image: none; }
#d11 { background: -moz-linear-gradient(top, blue, blue); }
#d12 { background: none; }
#d13 { background: -moz-linear-gradient(top, red, red); }
#d14 { background: transparent; }
#d15 { background: inherit; }
#d16 { background: none; background-color: green; }
#d17 { background: none !important; }
#d17 { background-color: green; }
</style></head><body>
<div class="c" id="d0"></div><div class="c" id="d1"></div><div class="c" id="d2"></div><div class="c" id="d3"></div><div class="c" id="d4"></div><div class="c" id="d5"></div><div class="c" id="d6"></div><div class="c" id="d7"></div><div class="c" id="d8"></div><div class="c" id="d9"></div><div class="c" id="d10"></div><div class="c" id="d11"></div><div class="g" id="d12"></div><div class="g" id="d13"></div><div class="c" id="d14"></div><div class="c" id="d15"></div><div class="c" id="d16"></div><div class="c" id="d17"></div>
</body></html>
