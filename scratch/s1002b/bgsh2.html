<!doctype html>
<html><head><meta charset="utf-8">
<style>
body { margin: 10px; background: #fff; }
div { float: left; width: 120px; height: 60px; margin: 0 8px 8px 0; outline: 1px solid #ccc; }
#e0 { background-image: url(dot.png); background-repeat: no-repeat; background-position: center; }
#e1 { background: url(dot.png) no-repeat; }
#e2 { background: url(dot.png) no-repeat center; }
#e3 { background: url(dot.png) no-repeat right bottom; }
#e4 { background: url(dot.png) repeat-x; }
#e5 { background: url(dot.png) no-repeat 10px 20px / 40px 30px; }
#e6 { background: #ff0 url(dot.png) no-repeat center; }
#e7 { background: linear-gradient(blue, blue) no-repeat 20px 10px / 30px 15px; }
#e8 { background: url(dot.png) center / cover no-repeat; }
#e9 { background: url(dot.png) center / contain no-repeat #eee; }
#e10 { background: url(dot.png); }
#e11 { background: no-repeat center url(dot.png); }
#e12 { background: url(dot.png) 50% 50% no-repeat, linear-gradient(#cfc, #cfc); }
#e13 { background: url(dot.png) no-repeat; background-position: right 5px bottom 5px; }
#e14 { background-position: center; background-repeat: no-repeat; background: url(dot.png); }
</style></head><body>
<div id="e0"></div><div id="e1"></div><div id="e2"></div><div id="e3"></div><div id="e4"></div><div id="e5"></div><div id="e6"></div><div id="e7"></div><div id="e8"></div><div id="e9"></div><div id="e10"></div><div id="e11"></div><div id="e12"></div><div id="e13"></div><div id="e14"></div>
</body></html>
