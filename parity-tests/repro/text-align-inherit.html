<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#f1f5f9;font-family:-apple-system,sans-serif}
.box{border:1px solid #333;margin:12px 24px;padding:16px}
.parentcenter{text-align:center}
h2{font-size:2rem;font-weight:400}
.directcenter{text-align:center}
</style></head><body>
<div class="box parentcenter"><h2>INHERITED (parent text-align:center)</h2></div>
<div class="box"><h2 class="directcenter">DIRECT (h2 text-align:center)</h2></div>
<div class="box parentcenter"><p>inherited paragraph text should center</p></div>
</body></html>
