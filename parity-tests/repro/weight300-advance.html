<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: -apple-system, "system-ui", sans-serif; }
  p { margin: 0; font-size: 20px; white-space: nowrap; display: inline-block; background: #eee; }
  /* Same string and size as about.html .tagline, which is font-weight:300.
     If w300 and w400 advances are identical, RustKit is not selecting a Light face. */
  #w300 { font-weight: 300; }
  #w400 { font-weight: 400; }
  #w700 { font-weight: 700; }
</style>
</head>
<body>
  <div><p id="w300">A browser that doesn't track you. Built from scratch in Rust.</p></div>
  <div><p id="w400">A browser that doesn't track you. Built from scratch in Rust.</p></div>
  <div><p id="w700">A browser that doesn't track you. Built from scratch in Rust.</p></div>
</body>
</html>
