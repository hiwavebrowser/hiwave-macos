<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; padding: 20px; }
  .b { width: 150px; height: 100px; margin: 10px; display: inline-block; background: #3498db; }
  .u1 { border: 1px solid #333; border-radius: 8px; }
  .u2 { border: 2px solid #333; border-radius: 12px; background: #fff; }
  .u5 { border: 5px solid #2c3e50; border-radius: 30px; }
  .mix { border-top: 10px solid #e74c3c; border-right: 5px solid #f39c12;
         border-bottom: 2px solid #2ecc71; border-left: 8px solid #9b59b6; border-radius: 20px; }
  .small { border: 8px solid #2c3e50; border-radius: 4px; }
  .one { border-top-left-radius: 30px; border: 6px solid #c0392b; }
  .pill { width: 120px; height: 36px; border: 2px solid #2980b9; border-radius: 18px; background: #eaf2f8; }
  .zero { border-left: 6px solid #8e44ad; border-radius: 16px; }
</style>
</head>
<body>
  <div class="b u1"></div><div class="b u2"></div><div class="b u5"></div><div class="b mix"></div>
  <div class="b small"></div><div class="b one"></div><div class="b pill"></div><div class="b zero"></div>
</body>
</html>
