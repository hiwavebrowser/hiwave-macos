<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .v { width: 300px; height: 200px; }
  /* V1: EXACT settings body — radial(circle at top right, ..., transparent 40%) OVER solid */
  #v1 { background: radial-gradient(circle at top right, rgba(6,182,212,0.3), transparent 40%), #0f172a; }
  /* V2: radial layer ALONE (no solid under it) */
  #v2 { background: radial-gradient(circle at top right, rgba(6,182,212,0.3), transparent 40%); }
  /* V3: same but explicit rgba(...,0) instead of the `transparent` keyword */
  #v3 { background: radial-gradient(circle at top right, rgba(6,182,212,0.3), rgba(6,182,212,0) 40%), #0f172a; }
  /* V4: opaque end stop (isolates whether alpha-interp is the issue vs layering) */
  #v4 { background: radial-gradient(circle at top right, rgba(6,182,212,0.3), #0f172a 40%), #0f172a; }
</style>
</head>
<body>
  <div class="v" id="v1"></div>
  <div class="v" id="v2"></div>
  <div class="v" id="v3"></div>
  <div class="v" id="v4"></div>
</body>
</html>
