<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
/* IFC Slice C prep (+ A/B smoke) — text + replaced + text on one line.
   Expect: one baseline band when width allows; center shifts as a unit.
   16×16 PNG is 1×1 red pixel scaled via width/height attrs (no external asset).
   See trench/forensics/2026-07-11-ifc-b2-midline-split-BRIEF.md §8 */
* { margin: 0; padding: 0; }
body { background: #fff; font-family: Arial, sans-serif; font-size: 16px; }
.row { width: 220px; margin: 12px 0; border: 1px solid #ddd; line-height: 24px; }
.c { text-align: center; }
.r { text-align: right; }
.l { text-align: left; }
img { width: 16px; height: 16px; vertical-align: baseline; }
.mid img { vertical-align: middle; }
.lab { font-size: 10px; color: #888; margin-top: 8px; }
</style></head>
<body>
<p class="lab">left — text + img + text (must share one line)</p>
<div class="row l">before <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" alt=""> after</div>

<p class="lab">center — same group as one unit</p>
<div class="row c">before <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" alt=""> after</div>

<div class="row r">before <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" alt=""> after</div>

<p class="lab">middle valign (Slice C) — img vertically centered on line</p>
<div class="row l mid">aa <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" alt=""> bb</div>
</body></html>
