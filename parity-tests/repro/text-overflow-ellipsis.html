<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 8px; font-family: sans-serif; font-size: 14px; background: #fff; color: #000; }
  .row { display: flex; align-items: center; width: 220px; border: 1px solid #888; margin-bottom: 8px; }
  .icon { width: 16px; height: 16px; background: #48c; flex: none; margin-right: 6px; }
  .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plain { width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid #888; margin-bottom: 8px; padding: 0 4px; }
  .clip { width: 160px; white-space: nowrap; overflow: hidden; border: 1px solid #888; margin-bottom: 8px; }
  .fits { width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid #888; margin-bottom: 8px; }
  .visible { width: 160px; white-space: nowrap; text-overflow: ellipsis; border: 1px solid #888; margin-bottom: 8px; }
</style>
</head>
<body>
  <div class="row"><div class="icon"></div><div class="title">The quick brown fox jumps over the lazy dog</div></div>
  <div class="plain">The quick brown fox jumps over the lazy dog</div>
  <div class="plain">Inline <span style="font-weight: bold">bold run that overflows</span> the box</div>
  <div class="clip">Clip only: the quick brown fox jumps over</div>
  <div class="fits">Short title fits</div>
  <div class="visible">Visible: the quick brown fox jumps over</div>
</body>
</html>
