<!DOCTYPE html>
<!--
  Falsification fixture: a positioned box must carry its already-laid-out
  subtree when it moves.

  Layout places children at the FLOW origin, THEN apply_position_offsets moves
  a positioned box. Content coordinates are absolute, so moving only the box
  origin stranded every descendant (text, nested boxes) at the flow position:
    - `.overlay` (position:absolute; bottom:0) laid its caption out at the
      flow origin (below the 200px card) where overflow:hidden CLIPPED it —
      the caption vanished. This is the image-gallery / card-caption pattern.
    - `.rel` (position:relative; top/left) moved its box but left its text at 0,0.

  Expected after the fix: the caption "Mountain Vista / Portrait orientation"
  paints at the card's bottom-left, and the relative box's text moves with it.
-->
<html><head><meta charset="UTF-8"><style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; color: #fff; font-family: -apple-system, sans-serif; }
  .card {
    position: relative; width: 300px; height: 200px; margin: 20px;
    border-radius: 12px; overflow: hidden;
    background: linear-gradient(135deg, #6a5acd, #48d1cc);
  }
  .ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 3em; }
  .overlay {
    position: absolute; bottom: 0; left: 0; right: 0; padding: 15px;
    background: linear-gradient(transparent, rgba(0,0,0,0.7));
  }
  .overlay h3 { font-size: 1em; margin-bottom: 4px; }
  .overlay p { font-size: 0.8em; color: #ccc; }
  .rel { position: relative; top: 40px; left: 120px; width: 200px; background: #334; padding: 6px; }
</style></head><body>
  <div class="card">
    <div class="ph">IMG</div>
    <div class="overlay"><h3>Mountain Vista</h3><p>Portrait orientation</p></div>
  </div>
  <div class="rel">relative box text moves with its box</div>
</body></html>
