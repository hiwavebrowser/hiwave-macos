<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>grid of flex rows holding inline kbd keys (new_tab shortcuts)</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; background: #fff; color: #222; }
  .label { font: 12px monospace; color: #888; margin: 8px 0 2px; }
  /* A: the new_tab idiom verbatim — auto-fit grid of flex rows, kbd inline keys + text + flex:1 span */
  .shortcuts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; width: 536px; }
  .shortcut { display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: #eef; border: 1px solid #99c; border-radius: 8px; font-size: 14px; }
  .shortcut kbd { background: #fff; padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 12px; border: 1px solid #aaa; font-weight: 600; }
  .shortcut-label { flex: 1; text-align: left; }
  /* B: one flex row alone (no grid) */
  .solo { width: 262px; }
  /* C: flex row with only text children (no kbd) */
  /* D: block row (not flex) with the same kbd children */
  .blockrow { display: block; width: 262px; padding: 12px 16px; background: #efe; border: 1px solid #9c9; font-size: 14px; }
  .blockrow kbd { background: #fff; padding: 4px 8px; font-family: monospace; font-size: 12px; border: 1px solid #aaa; font-weight: 600; }
</style>
</head>
<body>
<div class="label">A grid auto-fit of flex rows</div>
<div class="shortcuts" id="a">
  <div class="shortcut"><kbd>Ctrl</kbd>/<kbd>Cmd</kbd>+<kbd>K</kbd> <span class="shortcut-label">Command Palette</span></div>
  <div class="shortcut"><kbd>Ctrl</kbd>/<kbd>Cmd</kbd>+<kbd>T</kbd> <span class="shortcut-label">New Tab</span></div>
  <div class="shortcut"><kbd>Ctrl</kbd>/<kbd>Cmd</kbd>+<kbd>W</kbd> <span class="shortcut-label">Close Tab</span></div>
  <div class="shortcut"><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> <span class="shortcut-label">Shelve Tab</span></div>
</div>
<div class="label">B one flex row alone</div>
<div class="shortcut solo" id="b"><kbd>Ctrl</kbd>/<kbd>Cmd</kbd>+<kbd>K</kbd> <span class="shortcut-label">Command Palette</span></div>
<div class="label">C flex row, text only</div>
<div class="shortcut solo" id="c">Ctrl/Cmd+K <span class="shortcut-label">Command Palette</span></div>
<div class="label">D block row, same kbd children</div>
<div class="blockrow" id="d"><kbd>Ctrl</kbd>/<kbd>Cmd</kbd>+<kbd>K</kbd> <span>Command Palette</span></div>
</body>
</html>
