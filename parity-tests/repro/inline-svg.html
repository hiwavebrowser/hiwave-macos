<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html { line-height: 1.5; }
  body { margin: 0; padding: 20px; font-family: sans-serif; background: #fff; }
  .row { display: flex; gap: 20px; align-items: flex-start; }
  .icon-wrap { color: #6b7280; }
</style>
</head>
<body>
  <div class="row">
    <!-- images-intrinsic pattern: colored rect + centered text label -->
    <svg width="200" height="150" viewBox="0 0 200 150">
      <rect fill="#4a90d9" width="200" height="150"/>
      <text x="100" y="75" text-anchor="middle" fill="white" font-size="14">200×150</text>
    </svg>
    <!-- shelf pattern: stroke-only currentColor icon -->
    <span class="icon-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <path d="M21 21l-4.35-4.35"/>
      </svg>
    </span>
    <!-- filled shapes: circle and path -->
    <svg width="48" height="48" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="20" fill="#67b26f"/>
    </svg>
    <svg width="48" height="48" viewBox="0 0 24 24">
      <path d="M12 2L2 22h20z" fill="#d9534f"/>
    </svg>
    <!-- polygon + line -->
    <svg width="48" height="48" viewBox="0 0 48 48">
      <polygon points="24,4 44,44 4,44" fill="#f0ad4e"/>
      <line x1="4" y1="4" x2="44" y2="4" stroke="#333" stroke-width="2"/>
    </svg>
  </div>
</body>
</html>
