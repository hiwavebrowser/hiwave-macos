<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html, body { margin: 0; background: #fff; color: #000; }
p { margin: 0; position: absolute; left: 20px; font: 16px/32px Arial; }
.a { top: 20px; }
.b { top: 80px; }
.c { top: 140px; }
.d { top: 200px; }
</style></head><body>
<p class="a">plain HxHx text</p>
<p class="b">plain <span>HxHx</span> text</p>
<p class="c">plain <span><strong>HxHx</strong></span> text</p>
<p class="d">plain <a href="#"><em><b>HxHx</b></em></a> text</p>
</body></html>
