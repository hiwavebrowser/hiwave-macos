<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .v { width: 300px; height: 200px; }
  #p1 { background: radial-gradient(circle at top right,    rgba(6,182,212,0.9), transparent 45%), #0f172a; }
  #p2 { background: radial-gradient(circle at top left,     rgba(6,182,212,0.9), transparent 45%), #0f172a; }
  #p3 { background: radial-gradient(circle at bottom right, rgba(6,182,212,0.9), transparent 45%), #0f172a; }
  #p4 { background: radial-gradient(circle at center,       rgba(6,182,212,0.9), transparent 45%), #0f172a; }
  #p5 { background: radial-gradient(circle at top,          rgba(6,182,212,0.9), transparent 45%), #0f172a; }
  #p6 { background: radial-gradient(circle at right,        rgba(6,182,212,0.9), transparent 45%), #0f172a; }
</style>
</head>
<body>
  <div class="v" id="p1"></div>
  <div class="v" id="p2"></div>
  <div class="v" id="p3"></div>
  <div class="v" id="p4"></div>
  <div class="v" id="p5"></div>
  <div class="v" id="p6"></div>
</body>
</html>
