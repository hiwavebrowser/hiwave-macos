<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>h1 line box height with explicit line-height:normal</title>
  <style>
    h1 { margin: 0; background: #dd3333; line-height: normal; }
    .marker { height: 20px; background: #3333dd; }
  </style>
</head>
<body>
  <h1>Heading</h1>
  <div class="marker"></div>
</body>
</html>
