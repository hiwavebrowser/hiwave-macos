[package]
name = "rustkit-http"
version = "0.1.0"
edition = "2021"
description = "HTTP client for RustKit browser engine"
license = "MIT"

[dependencies]
# TLS: rustls with a browser-typical client profile (network lane,
# 2026-09-28 diagnosis: every known-library ClientHello is default-denied by
# Cloudflare/Akamai/DataDome at request one; native-tls sent no ALPN at all).
rustls = "0.23"
tokio-rustls = "0.26"
rustls-native-certs = "0.8"

# Async runtime
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt"] }

# HTTP types
http = "1.2"
bytes = "1.9"

# URL parsing
url = "2"

# Error handling
thiserror = "1"

# Logging
tracing = "0.1"

# Futures
futures = "0.3"

# Base64 for auth
base64 = "0.22"

# Content-Encoding: gzip / deflate
flate2 = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
