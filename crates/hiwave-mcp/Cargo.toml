[package]
name = "hiwave-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server exposing RustKit's engine to agents — in-process, persistent, introspective"

[[bin]]
name = "hiwave-mcp"
path = "src/main.rs"

[dependencies]
rustkit-engine = { path = "../rustkit-engine", features = ["headless"] }
rustkit-viewhost = { path = "../rustkit-viewhost" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
