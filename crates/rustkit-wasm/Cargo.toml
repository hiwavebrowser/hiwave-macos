[package]
name = "rustkit-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly for the RustKit browser engine, on wasmi (WASM W1, docs/design/WASM-W1.md)"
authors = ["HiWave Team"]
license = "AGPL-3.0-or-later"

[dependencies]
boa_engine = "0.22"
# WebAssembly interpreter (MIT OR Apache-2.0), approved 2026-11-14. Pinned: W1's design was
# checked against 2.0.0's source. Only the features W1 uses.
# wasmi's default dispatch: tail calls. It runs JetStream's wasm tests 1.3-2.7x
# faster than `portable-dispatch` (docs/diagnostics/2026-11-24/wasm_dispatch_ab_legion5/),
# but its stack stays flat only when the optimizer turns the calls into jumps,
# so wasmi is built at opt-level 3 in every profile (workspace Cargo.toml,
# [profile.dev.package.wasmi]) and a test guards it.
wasmi = { version = "=2.0.0", default-features = false, features = ["std", "validate"] }
# wasmi's own core crate, at wasmi's pinned version: its ResourceLimiter's error type
# (LimiterError) is public only here (wasmi re-exports it from a private module).
wasmi_core = { version = "=2.0.0", default-features = false, features = ["std"] }
