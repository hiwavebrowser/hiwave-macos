<!doctype html><html><head><meta charset="utf-8"><style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; }
.mc  { width: min-content; outline: 1px solid red; margin-bottom: 4px; }
.xc  { width: max-content; outline: 1px solid blue; margin-bottom: 4px; }
.btn { padding: 8px 16px; border: 1px solid #333; font-size: 14px; font-family: Arial; }
.bare { font-size: 13.333px; }
</style></head><body>
<div class="mc"><button id="b1" class="btn">Save Changes</button></div>
<div class="xc"><button id="b2" class="btn">Save Changes</button></div>
<div class="mc"><button id="b3" class="btn">Cancel</button></div>
<div class="xc"><button id="b4" class="btn">Cancel</button></div>
<div class="mc"><button id="b5" class="btn">A veryverylongsingleword x</button></div>
<div class="xc"><button id="b6" class="btn">A veryverylongsingleword x</button></div>
<div class="mc"><button id="b7">Save Changes</button></div>
<div class="xc"><button id="b8">Save Changes</button></div>

<div class="mc"><input id="i1" type="text"></div>
<div class="xc"><input id="i2" type="text"></div>
<div class="mc"><input id="i3" type="text" class="btn"></div>
<div class="xc"><input id="i4" type="text" class="btn"></div>

<div class="mc"><select id="s1"><option>A longer option text</option><option>Short</option></select></div>
<div class="xc"><select id="s2"><option>A longer option text</option><option>Short</option></select></div>

<div class="mc"><textarea id="t1"></textarea></div>
<div class="xc"><textarea id="t2"></textarea></div>

<div class="mc"><input id="c1" type="checkbox"></div>
<div class="mc"><input id="r1" type="range"></div>

<!-- span control: same label, same padding, not a form control -->
<div class="mc"><span id="p1" class="btn" style="display:inline-block">Save Changes</span></div>
<div class="xc"><span id="p2" class="btn" style="display:inline-block">Save Changes</span></div>

<!-- flex line, narrow: does the control floor at min-content? -->
<div style="display:flex; width:120px; outline:1px solid green">
  <button id="f1" class="btn">Save Changes</button><button id="f2" class="btn">Cancel</button>
</div>
<!-- float shrink-to-fit in a narrow parent -->
<div style="width:60px; outline:1px solid orange"><button id="g1" class="btn" style="float:left">Save Changes</button></div>
<span id="w1" style="font:14px Arial">Save</span><span id="w2" style="font:14px Arial">Changes</span><span id="w3" style="font:14px Arial">Save Changes</span>
</body></html>
