  every group falls back to the per-command path. 800x600, DPR 1, against
  Chrome 148.0.7778.216. Even cells: invert(1) on red with a blue child
  (-> cyan, yellow). Odd cells: grayscale(1) + opacity:.5.

    develop 4a657f08: 252000 px (every cell unfiltered past the budget)
    this branch:       27440 px = 140 odd cells x the 14x14 child. Per

                      Chrome fades the group as one picture. That is the

                      (invert) cells match exactly.
-->
