<!doctype html><!-- CH2.E10b (report x6: #activityChart/#protectionChart 0x0 vs Chrome 143 910x300). Each canvas is sized from one
  query of its 40px-high relative parent, the way Chart.js 4.4 getMaximumSize does: p = getBoundingClientRect at parse time,
  a = getBoundingClientRect / b = clientWidth/Height / g = getComputedStyle in a microtask after DOMContentLoaded. Expected (Chrome 143): all 800x40.
  RustKit develop bd10a85d: MEASUREMENT PENDING (gated runner). A canvas at 0 wide names the query that read no layout. -->
<style>body{margin:0}.c{position:relative;height:40px;margin-bottom:4px}canvas{display:block;background:#08f}</style>
<div class="c"><canvas id="p"></canvas></div><div class="c"><canvas id="a"></canvas></div>
<div class="c"><canvas id="b"></canvas></div><div class="c"><canvas id="g"></canvas></div>
<script>
function size(id,f){var c=document.getElementById(id),w=f(c.parentNode);c.style.width=w[0]+'px';c.style.height=w[1]+'px';c.width=w[0];c.height=w[1];}
function rect(p){var r=p.getBoundingClientRect();return[r.width,r.height];}
size('p',rect);
document.addEventListener('DOMContentLoaded',function(){Promise.resolve().then(function(){
  size('a',rect);size('b',function(p){return[p.clientWidth,p.clientHeight];});
  size('g',function(p){var s=getComputedStyle(p);return[parseFloat(s.width),parseFloat(s.height)];});});});
</script>
