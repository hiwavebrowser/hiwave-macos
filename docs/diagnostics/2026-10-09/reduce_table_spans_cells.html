<!doctype html><meta charset="utf-8"><title>reduce colspan + rowspan table</title>
<style>
body { margin: 8px; font: 14px Arial, sans-serif; }
table { border-spacing: 0; border: 1px solid #000; }
td { border: 1px solid #00f; padding: 2px; height: 26px; background: #cfc; }
</style>
<table id="t">
<tr><td id="a" rowspan="2" width="50">A</td><td id="b" colspan="2">B spans two</td></tr>
<tr><td id="c" width="70">C</td><td id="d" width="40">D</td></tr>
<tr><td id="e" colspan="3">E spans three</td></tr></table>
