<!doctype html><title>frame stamp probe</title><div id=box style="width:10px;height:10px;background:#08f"></div><script>
// PACE2 grid row, R1 follow-ups: what a frame's callbacks are stamped with, against the task that
// asked for the frame. Records:
//   idle      after 300 ms with no frame, a timer task asks for one: [perf at the request,
//             the frame's timestamp, the timeline's currentTime inside the callback, perf inside]
//   timeline  for 30 frames of a loop: timestamp === document.timeline.currentTime inside
//   sweep     for k = 0..40: a frame at time T asks setTimeout(task, k); the task asks for a
//             frame; [k, task's perf - T, that frame's timestamp - T] (which frame the task's
//             request lands in, as the task's time crosses the next frame's), and the callback's
//             own performance.now() - T (when it ran: at once, or at that frame's time)
//   longTimer for 9 rounds: a frame at T0 asks for the next frame and posts a task that works
//             W = 45, 100 or 200 ms, so that frame runs late; its callback sets setTimeout(task, 5)
//             and the task asks for a frame: [W, late frame's t - T0, perf in it - T0, perf at the request - T0,
//             the requested frame's t - T0, perf in it - T0]: is the stamp ever below the last?
//   longFirst for 3 rounds: after 300 ms with no frame, a timer task asks for a frame and then
//             works 600 ms in the same task: [the frame's t - perf at the request,
//             perf in the callback - perf at the request]
// Pinned on Chrome for Testing 148.0.7778.216, HEADLESS (frame_stamp_probe_chrome.mjs). Headless
// frame scheduling has not been checked against a headed run: row FRAMEPIN-HEADED (low priority).
// When done it sets rec.done and logs REC <json>.
// Everything starts in go(): at the window's load event, or, with #manual in the URL, when the
// harness calls it (RustKit runs a load's timers up to 5 s ahead of real time, its load horizon).
window.rec = { idle: [], timeline: [], sweep: [], longTimer: [], longFirst: [], done: false };
function r2(x) { return Math.round(x * 100) / 100; }
function idlePart(next) {
  setTimeout(function () {
    var asked = performance.now();
    requestAnimationFrame(function (t) {
      rec.idle.push([r2(asked), r2(t), document.timeline ? r2(document.timeline.currentTime) : null, r2(performance.now())]);
      if (rec.idle.length < 5) idlePart(next); else next();
    });
  }, 300);
}
function timelinePart(next) {
  var n = 0;
  (function f() {
    requestAnimationFrame(function (t) {
      rec.timeline.push(document.timeline ? t === document.timeline.currentTime : null);
      if (++n < 30) f(); else next();
    });
  })();
}
function sweepPart(k, next) {
  if (k > 40) { next(); return; }
  requestAnimationFrame(function (T) {
    setTimeout(function () {
      var at = performance.now();
      requestAnimationFrame(function (t) {
        rec.sweep.push([k, r2(at - T), r2(t - T), r2(performance.now() - T)]);
        sweepPart(k + 1, next);
      });
    }, k);
  });
}
function spin(ms) { var t0 = performance.now(); while (performance.now() - t0 < ms) {} }
function longTimerPart(n, next) {
  if (n >= 9) { next(); return; }
  var W = [45, 100, 200][n % 3];
  requestAnimationFrame(function (T0) {
    requestAnimationFrame(function (t1) {
      var p1 = performance.now();
      setTimeout(function () {
        var asked = performance.now();
        requestAnimationFrame(function (t2) {
          rec.longTimer.push([W, r2(t1 - T0), r2(p1 - T0), r2(asked - T0), r2(t2 - T0), r2(performance.now() - T0)]);
          setTimeout(function () { longTimerPart(n + 1, next); }, 50);
        });
      }, 5);
    });
    setTimeout(function () { spin(W); }, 0);
  });
}
function longFirstPart(n, next) {
  if (n >= 3) { next(); return; }
  setTimeout(function () {
    var asked = performance.now();
    requestAnimationFrame(function (t) {
      rec.longFirst.push([r2(t - asked), r2(performance.now() - asked)]);
      longFirstPart(n + 1, next);
    });
    spin(600);
  }, 300);
}
function go() {
  idlePart(function () {
    timelinePart(function () {
      sweepPart(0, function () {
        longTimerPart(0, function () {
          longFirstPart(0, function () { rec.done = true; console.log('REC ' + JSON.stringify(rec)); });
        });
      });
    });
  });
}
if (location.hash !== '#manual') addEventListener('load', go);
</script>
