<!doctype html><html><head><meta charset="utf-8"><title>child</title>
<link rel="stylesheet" href="frame_style_child.css">
</head><body>
<div id="stage"></div>
<script>
// What the frame's own script sees while the document is still loading.
var r = document.getElementById("stage").getBoundingClientRect();
window.atScript = Math.round(r.width) + "x" + Math.round(r.height) + " " + getComputedStyle(document.getElementById("stage")).position;
</script>
</body></html>
