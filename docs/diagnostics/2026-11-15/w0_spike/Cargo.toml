# W0 spike (STR-3 WebAssembly). NOT a workspace member: it is its own workspace, built by hand.
#   cd docs/diagnostics/2026-11-15/w0_spike && CARGO_TARGET_DIR=<somewhere outside the repo> cargo run --release
#   cargo run --release --bin load5     # needs the pinned JetStream checkout at ~/zg-measure/stress-suites/JetStream
# It depends on wasmi 2.0.0 from crates.io (MIT OR Apache-2.0) and on the vendored Boa through the patch
# section below. Nothing here is built by the repo's own gates and nothing in the repo depends on it.
[package]
name = "wasmi_spike"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
wasmi = "2"
wat = "1"
aligned-vec = "0.6.4"
boa_engine = "0.22.0"

[workspace]

[patch.crates-io]
boa_engine = { path = "../../../../third_party/boa_engine" }
boa_parser = { path = "../../../../third_party/boa_parser" }
boa_ast = { path = "../../../../third_party/boa_ast" }
