<!doctype html><html><head><meta charset="utf-8"><title>child</title></head><body>
<script>
// Called by the parent from the frame's load handler: a long task, then animation frames in this document.
// Each frame records this document's performance.now() and Date.now() since the task began.
window.go = function (busyMs, frames, done) {
  var p0 = performance.now(), d0 = Date.now(), rows = [];
  while (Date.now() - d0 < busyMs) { }
  var afterTask = [Math.round(performance.now() - p0), Date.now() - d0];
  function tick(ts) {
    rows.push([Math.round(performance.now() - p0), Date.now() - d0, Math.round(ts - p0)]);
    if (rows.length < frames) requestAnimationFrame(tick); else done({ afterTask: afterTask, frames: rows });
  }
  requestAnimationFrame(tick);
};
</script>
</body></html>
