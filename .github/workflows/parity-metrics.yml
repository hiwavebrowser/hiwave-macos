name: Parity Metrics

on:
  push:
    # Master only. This job books a 30-minute macos-14 runner, but the only
    # step that produces anything durable — "Update metrics history" — is
    # already gated to master/main. On a feature branch the whole run
    # existed to upload an artifact nobody reads, while emitting a CI
    # notification per push. Branch work is covered by the Parity Gate's
    # pr-swarm, which actually gates.
    branches: [master, main]
  workflow_dispatch:  # Allow manual triggers
  # Nightly develop receipt (2026-09-23). Per-run parity outputs are no
  # longer committed in PRs (see .gitignore), so develop's numbers come from
  # this run: it appends a `develop` row to metrics-history and writes a
  # night-over-night per-case comparison. 04:00 UTC = midnight EDT (23:00 EST).
  schedule:
    - cron: "0 4 * * *"

env:
  RUST_BACKTRACE: 1

jobs:
  collect-metrics:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write  # Needed to push metrics

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for metrics branch
          # Scheduled runs measure develop; pushes measure the pushed ref.
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}

      - name: Resolve measured commit
        id: rev
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "branch=develop" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install oracle deps
        working-directory: tools/parity_oracle
        run: npm ci

      - name: Build Rust
        run: cargo build --release -p parity-capture

      - name: Run parity tests
        continue-on-error: true  # Don't fail workflow on test threshold failures - this is for metrics collection
        run: |
          python3 scripts/parity_test.py \
            --scope all \
            --iterations 1 \
            --output parity-baseline/parity_test_results.json

      - name: Extract metrics
        id: metrics
        run: |
          python3 scripts/extract_parity_metrics.py \
            --input parity-baseline/parity_test_results.json \
            --output parity-metrics.json \
            --commit ${{ steps.rev.outputs.sha }} \
            --branch ${{ steps.rev.outputs.branch }}

      - name: Generate Job Summary
        run: |
          python3 scripts/extract_parity_metrics.py \
            --input parity-baseline/parity_test_results.json \
            --format markdown >> $GITHUB_STEP_SUMMARY

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: parity-metrics-${{ steps.rev.outputs.sha }}
          path: parity-metrics.json
          retention-days: 90

      # Store metrics history in a separate branch
      - name: Update metrics history
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'schedule'
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The parity run modifies TRACKED result files (parity-baseline/*),
          # and a dirty tree blocks `git checkout metrics-history` — which
          # then cascades into the orphan fallback failing with "branch
          # already exists" (the fetch created it). Save the untracked
          # metrics file aside and discard the regenerable modifications
          # before switching branches.
          cp parity-metrics.json /tmp/parity-metrics.json
          git checkout -- .

          # Create or checkout metrics branch
          git fetch origin metrics-history:metrics-history 2>/dev/null || true
          git checkout metrics-history 2>/dev/null || git checkout --orphan metrics-history
          cp /tmp/parity-metrics.json parity-metrics.json

          # Create metrics directory if it doesn't exist
          mkdir -p metrics

          # Copy new metrics with timestamp
          TIMESTAMP=$(date -u +"%Y%m%d_%H%M%S")
          BRANCH="${{ steps.rev.outputs.branch }}"
          # Night-over-night comparison: this run vs the previous run of the
          # same branch, per case. Written before the new run is added so
          # "previous" is unambiguous.
          python3 - "$BRANCH" <<'PY' > "metrics/compare-${BRANCH}.md"
          import glob, json, sys
          branch = sys.argv[1]
          new = json.load(open("parity-metrics.json"))
          prev = None
          for f in sorted(glob.glob("metrics/*_*.json"), reverse=True):
              try:
                  m = json.load(open(f))
              except Exception:
                  continue
              if m.get("branch") == branch:
                  prev = m
                  break
          print(f"# Parity {branch}: {new['commit'][:8]} ({new['timestamp']})\n")
          if prev is None:
              print(f"First {branch} run. avg {new['average_diff']:.4f}, {new['passed']}/{new['total']} passed.")
              sys.exit()
          print(f"vs previous {branch} run {prev['commit'][:8]} ({prev['timestamp']})\n")
          print(f"avg {prev['average_diff']:.4f} -> {new['average_diff']:.4f} ({new['average_diff'] - prev['average_diff']:+.4f}); "
                f"passed {prev['passed']}/{prev['total']} -> {new['passed']}/{new['total']}\n")
          old = {t["name"]: t["diff"] for t in prev.get("tests", [])}
          rows = [(t["name"], old.get(t["name"]), t["diff"]) for t in new.get("tests", [])]
          moved = [r for r in rows if r[1] is None or abs(r[2] - r[1]) > 1e-9]
          if not moved:
              print("All cases byte-flat.")
          else:
              print("| case | before | after | change |\n|---|---:|---:|---:|")
              for name, a, b in sorted(moved, key=lambda r: -(abs(r[2] - (r[1] or 0)))):
                  a_s = "new" if a is None else f"{a:.4f}"
                  d = "" if a is None else f"{b - a:+.4f}" + (" UP" if b > a else "")
                  print(f"| {name} | {a_s} | {b:.4f} | {d} |")
          PY
          cat "metrics/compare-${BRANCH}.md" >> "$GITHUB_STEP_SUMMARY"
          cp parity-metrics.json "metrics/${TIMESTAMP}_${{ steps.rev.outputs.sha }}.json"
          cp parity-metrics.json "metrics/latest-${BRANCH}.json"

          # Append to history CSV for easy charting
          python3 -c "
          import json
          import csv
          import os

          with open('parity-metrics.json') as f:
              m = json.load(f)

          csv_file = 'metrics/history.csv'
          file_exists = os.path.exists(csv_file)

          with open(csv_file, 'a', newline='') as f:
              writer = csv.writer(f)
              if not file_exists:
                  writer.writerow(['timestamp', 'commit', 'branch', 'avg_diff', 'passed', 'failed', 'total', 'worst_case', 'worst_diff'])
              writer.writerow([
                  m['timestamp'],
                  m['commit'][:8],
                  m['branch'],
                  round(m['average_diff'], 2),
                  m['passed'],
                  m['failed'],
                  m['total'],
                  m['worst_case']['name'],
                  round(m['worst_case']['diff'], 2)
              ])
          "

          # Commit and push
          git add metrics/
          git commit -m "Add parity metrics for ${{ steps.rev.outputs.branch }} ${{ steps.rev.outputs.sha }}" || echo "No changes to commit"
          git push origin metrics-history || echo "Push failed - may need to rebase"

      - name: Comment on PR with metrics
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const metrics = JSON.parse(fs.readFileSync('parity-metrics.json', 'utf8'));

            const body = `## 📊 Parity Metrics

            | Metric | Value |
            |--------|-------|
            | Average Diff | **${metrics.average_diff.toFixed(2)}%** |
            | Passed | ${metrics.passed}/${metrics.total} |
            | Failed | ${metrics.failed}/${metrics.total} |
            | Worst Case | ${metrics.worst_case.name} (${metrics.worst_case.diff.toFixed(2)}%) |

            <details>
            <summary>All Test Results</summary>

            | Test | Diff % | Status |
            |------|--------|--------|
            ${metrics.tests.map(t => `| ${t.name} | ${t.diff.toFixed(2)}% | ${t.passed ? '✅' : '❌'} |`).join('\n')}

            </details>

            _Commit: ${metrics.commit}_`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
