name: R1 label

# Pete 2026-11-13: `r1-clear` marks a PR whose current head has a clear
# independent R1, so nobody re-reviews it. Any new push (synchronize) means
# the reviewed head is gone, so the label is removed and a delta review is due.
# pull_request (not _target): _target reads the workflow from the default
# branch (master), so it would not run for develop PRs. Same-repo PRs get a
# write token; fork PRs get read-only and the step fails harmlessly.
on:
  pull_request:
    types: [synchronize]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  drop-r1-clear:
    if: contains(github.event.pull_request.labels.*.name, 'r1-clear')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Remove r1-clear (head changed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --remove-label r1-clear
          echo "r1-clear removed: head moved to ${SHA:0:8}; delta review due." >> "$GITHUB_STEP_SUMMARY"
